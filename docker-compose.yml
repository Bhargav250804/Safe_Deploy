# =============================================================================
# SafeDeploy - Local Development Docker Compose
# Usage: docker compose up --build
# =============================================================================
version: "3.9"

services:
  safedeploy-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safedeploy-app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - APP_ENVIRONMENT=development
      - APP_VERSION=1.0.0-dev
      - GIT_SHA=local
      - LOG_LEVEL=DEBUG
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped
